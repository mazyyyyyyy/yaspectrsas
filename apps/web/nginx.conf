server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Загрузка тела — под стать лимиту API (сметы это текст, не файлы).
  client_max_body_size 2m;

  # API — проксируем в контейнер api. Имя "api" резолвит docker-сеть compose.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # генерация PDF/DOCX бывает небыстрой
  }

  # Service worker и манифест не кешируем — иначе обновление приложения
  # застревает у пользователя.
  location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Собранные ассеты с хешем в имени — можно кешировать надолго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: всё остальное отдаём index.html, маршрутизацию делает React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
